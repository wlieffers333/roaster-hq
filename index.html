<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Two Tone Gift Card Balance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{--ink:#1c1714;--paper:#f6f1ea;--card:#fffdf9;--line:#e4dbcf;--muted:#7a6d62;--good:#2f6b45;--warn:#9a5b12;--bad:#a3322a}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:"DM Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:420px;margin:0 auto;padding:40px 20px;min-height:100vh;display:flex;flex-direction:column}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.04em;font-size:15px;margin-bottom:28px}
  .dot{width:24px;height:24px;border-radius:50%;background:linear-gradient(90deg,var(--ink) 50%,#fff 50%);border:2px solid var(--ink)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px 24px;box-shadow:0 10px 30px rgba(28,23,20,.06)}
  .label{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
  .bal{font-size:60px;font-weight:700;letter-spacing:-.03em;line-height:1;margin:10px 0 14px}
  .code{font-family:"DM Mono",ui-monospace,monospace;letter-spacing:.06em;font-size:14px;color:var(--muted)}
  .pill{display:inline-block;font-size:12px;font-weight:700;padding:5px 11px;border-radius:999px;margin-bottom:6px}
  .ok{background:#dcebdf;color:var(--good)} .warn{background:#f3e6d3;color:var(--warn)} .bad{background:#f2dcd9;color:var(--bad)}
  h1{font-size:22px;margin:6px 0 8px}
  p{line-height:1.5;margin:0 0 10px}
  .muted{color:var(--muted);font-size:14px}
  form{display:flex;gap:8px;margin-top:16px}
  input{flex:1;font:inherit;font-family:"DM Mono",monospace;font-size:16px;letter-spacing:.06em;text-transform:uppercase;padding:13px 14px;border-radius:12px;border:1.5px solid var(--line);background:#fff;color:var(--ink);min-width:0}
  input:focus{outline:none;border-color:var(--ink)}
  button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:0 18px;background:var(--ink);color:#fff;cursor:pointer}
  footer{margin-top:auto;padding-top:32px;text-align:center;font-size:13px;color:var(--muted)}
  footer a{color:var(--ink)}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><div class="dot"></div>TWO TONE COFFEE ROASTERS</div>
  <div class="card" id="out"><p class="muted">Checking your card…</p></div>
  <footer>
    Sip Coffee, Save Paws<br>
    <a href="https://twotoneroasters.com">twotoneroasters.com</a>
    <div id="manage" style="margin-top:22px;"></div>
  </footer>
</div>
<script>
const SUPABASE_URL = "https://moyphneawxlnnavtnfxz.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_StcVI60_FxqWGYRc2je5Pg_JQLsrLli"; // public key: can only look up a balance
const HQ_URL = "https://hq.twotoneroasters.com/";

const out = document.getElementById("out");
const money = c => "$" + (c / 100).toFixed(2);
const esc = s => String(s).replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));

function normalize(raw){
  let s = String(raw || "").toUpperCase().replace(/[^0-9A-Z]/g, "");
  if (s.startsWith("TT")) s = s.slice(2);
  return s.length === 8 ? "TT-" + s.slice(0,4) + "-" + s.slice(4) : "";
}

function askForCode(note){
  out.innerHTML = `
    ${note ? `<p>${note}</p>` : `<h1>Check your gift card</h1>`}
    <p class="muted">Enter the code printed under the QR code.</p>
    <form id="f"><input id="c" placeholder="TT-XXXX-XXXX" autocomplete="off" autocapitalize="characters"><button>Check</button></form>`;
  document.getElementById("f").onsubmit = e => {
    e.preventDefault();
    const code = normalize(document.getElementById("c").value);
    if (!code) { askForCode(`<span class="pill bad">Hmm</span><br>That doesn't look like a Two Tone card code.`); return; }
    history.replaceState(null, "", "/" + code);
    lookup(code);
  };
}

async function lookup(code){
  document.getElementById("manage").innerHTML = `<a href="${HQ_URL}#gift-${code}" style="color:var(--muted);font-size:12px;text-decoration:none;">Manage card</a>`;
  out.innerHTML = `<p class="muted">Checking your card…</p>`;
  try {
    const r = await fetch(SUPABASE_URL + "/rest/v1/rpc/gift_card_balance", {
      method: "POST",
      headers: { "Content-Type": "application/json", apikey: SUPABASE_ANON_KEY, Authorization: "Bearer " + SUPABASE_ANON_KEY },
      body: JSON.stringify({ p_code: code })
    });
    if (!r.ok) throw new Error(r.status);
    const rows = await r.json();
    const card = rows && rows[0];
    if (!card) return askForCode(`<span class="pill bad">Not found</span><br>We couldn't find card <span class="code">${esc(code)}</span>. Double-check the code, or ask us at the market.`);

    if (card.status === "active") {
      out.innerHTML = `
        <span class="pill ok">Active</span>
        <div class="label">Remaining balance</div>
        <div class="bal">${money(card.balance_cents)}</div>
        <div class="code">${esc(card.code)}</div>
        <p class="muted" style="margin-top:16px">Use it at any Two Tone market booth. No expiration.</p>`;
    } else if (card.status === "inactive") {
      out.innerHTML = `
        <span class="pill warn">Not activated yet</span>
        <h1>This card is ready to load</h1>
        <div class="code">${esc(card.code)}</div>
        <p class="muted" style="margin-top:14px">Pick any amount at a Two Tone market booth and we'll activate it on the spot.</p>`;
    } else {
      out.innerHTML = `
        <span class="pill bad">No longer valid</span>
        <h1>This card has been deactivated</h1>
        <div class="code">${esc(card.code)}</div>
        <p class="muted" style="margin-top:14px">If you think that's a mistake, come see us at the market.</p>`;
    }
  } catch (e) {
    out.innerHTML = `<p>We couldn't check the balance right now.</p><p class="muted">Check your connection and try again in a minute.</p>`;
  }
}

// Code comes from the link on the card: gift.twotoneroasters.com/TT-XXXX-XXXX
const fromUrl = normalize(location.pathname.split("/").filter(Boolean).pop() || new URLSearchParams(location.search).get("c") || location.hash.slice(1));
fromUrl ? lookup(fromUrl) : askForCode();
</script>
</body>
</html>
